<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>რზტ — მუსიკალური რეცენზიები და რეიტინგები</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="initial-page-loader" style="position: fixed; inset: 0; z-index: 999999; background-color: #0A0A0C; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto;">
      <!-- Inline Stage 90 Logo & Ambient Glow -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
        <div style="position: absolute; width: 220px; height: 220px; border-radius: 9999px; background: radial-gradient(circle, rgba(123, 61, 255, 0.35) 0%, rgba(0, 242, 254, 0.25) 50%, transparent 70%); filter: blur(40px);"></div>
        <div style="display: flex; align-items: center; gap: 12px; z-index: 1;">
          <span style="font-size: 28px; font-weight: 900; letter-spacing: 0.15em; color: #FFFFFF; font-family: sans-serif;">STAGE</span>
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="url(#stageGlowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="stageGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F2FE" />
                <stop offset="50%" stop-color="#7B3DFF" />
                <stop offset="100%" stop-color="#FF2ED1" />
              </linearGradient>
            </defs>
            <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z" />
          </svg>
        </div>
        <p style="margin-top: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.38em; color: rgba(245, 245, 247, 0.7); text-transform: uppercase; font-family: sans-serif; z-index: 1;">ეს არის კავშირი</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
